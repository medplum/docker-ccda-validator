name: Publish image

# Builds and pushes v<VERSION>-<sha> to ECR whenever VERSION changes on main,
# following the "Pushing to ECR" runbook in README.md: --no-cache so dnf
# upgrade reruns, and a docker v2 manifest so Inspector can scan it.
#
# Needs secrets.AWS_ROLE_TO_ASSUME / AWS_REGION with push access to the ECR
# repository plus inspector2:ListFindings. Deploying the new tag is separate.

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      ECR_REPOSITORY: medplum/ccda-validator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: Build the WAR
        run: scripts/build-war.sh

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve the tag
        id: tag
        run: |
          registry="$(aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" \
            --query 'repositories[0].repositoryUri' --output text | cut -d/ -f1)"
          tag="v$(cat VERSION)-$(git rev-parse --short HEAD)"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists in ECR. Bump VERSION to publish a new image."
            exit 1
          fi
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$registry/$ECR_REPOSITORY:$tag" >> "$GITHUB_OUTPUT"

      # oci-mediatypes=false is the Docker 29.x fix from the README: without it
      # the push is an OCI manifest that Inspector has not been shown to read.
      - name: Build and push
        run: |
          docker buildx build --pull --no-cache --platform linux/amd64 \
            --provenance=false --sbom=false \
            --output "type=image,name=${{ steps.tag.outputs.image }},oci-mediatypes=false,push=true" .

      - name: Verify the manifest media type
        run: |
          media_type="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="${{ steps.tag.outputs.tag }}" \
            --query 'imageDetails[0].imageManifestMediaType' --output text)"
          echo "manifest: $media_type"
          if [[ "$media_type" != application/vnd.docker.distribution.manifest.v2+json ]]; then
            echo "::error::Pushed $media_type; Inspector needs application/vnd.docker.distribution.manifest.v2+json"
            exit 1
          fi

      - name: Wait for the Inspector scan
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          for _ in $(seq 1 40); do
            status="$(aws ecr describe-image-scan-findings --repository-name "$ECR_REPOSITORY" \
              --image-id imageTag="$tag" --query 'imageScanStatus.status' --output text 2>/dev/null || echo PENDING)"
            echo "scan status: $status"
            case "$status" in
              ACTIVE|COMPLETE) break ;;
              UNSUPPORTED_IMAGE|FAILED) echo "::error::Inspector reported $status"; exit 1 ;;
            esac
            sleep 30
          done
          criteria="$(jq -n --arg repo "$ECR_REPOSITORY" --arg tag "$tag" '{
            ecrImageRepositoryName: [{comparison: "EQUALS", value: $repo}],
            ecrImageTags: [{comparison: "EQUALS", value: $tag}],
            findingStatus: [{comparison: "EQUALS", value: "ACTIVE"}]
          }')"
          aws inspector2 list-findings --filter-criteria "$criteria" --output json > inspector.json
          {
            echo "## Published \`${{ steps.tag.outputs.image }}\`"
            echo
            echo "Inspector scan: **$status**"
            echo
            echo "| Severity | Package | Version | Advisory | Fixed in |"
            echo "|---|---|---|---|---|"
            jq -r '.findings[] | .severity as $s | .packageVulnerabilityDetails as $d
              | $d.vulnerablePackages[] | "| \($s) | `\(.name)` | \(.version) | \($d.vulnerabilityId) | \(.fixedInVersion // "—") |"' inspector.json
          } >> "$GITHUB_STEP_SUMMARY"
